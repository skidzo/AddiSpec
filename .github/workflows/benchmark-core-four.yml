name: Core four geometry and meshes
on:
  push:
    paths:
      - 'benchmarks/pbf-lbm/core-four/**'
      - 'specimens/pbf-lbm/**'
      - '.github/workflows/benchmark-core-four.yml'
  pull_request:
    paths:
      - 'benchmarks/pbf-lbm/core-four/**'
      - 'specimens/pbf-lbm/**'
      - '.github/workflows/benchmark-core-four.yml'
permissions:
  contents: read
jobs:
  geometry-and-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install mesh runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglu1-mesa
          python3 -m venv /tmp/addispec-mesh-venv
          /tmp/addispec-mesh-venv/bin/pip install -r benchmarks/pbf-lbm/core-four/requirements.txt
      - name: Generate and verify four cases
        run: /tmp/addispec-mesh-venv/bin/python benchmarks/pbf-lbm/core-four/validate.py --output /tmp/addispec-core-four-run
      - name: Retain geometry and mesh evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: addispec-core-four
          path: /tmp/addispec-core-four-run
          if-no-files-found: error
          retention-days: 30
  core-production-3mf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install 3MF export runtime
        run: |
          python3 -m venv /tmp/addispec-3mf-venv
          /tmp/addispec-3mf-venv/bin/pip install -r benchmarks/pbf-lbm/core-four/requirements-3mf.txt
      - name: Export and verify 3MF cases
        run: /tmp/addispec-3mf-venv/bin/python benchmarks/pbf-lbm/core-four/export_3mf.py --output /tmp/addispec-core-four-3mf
      - name: Retain 3MF packages and verification report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: addispec-core-four-3mf
          path: /tmp/addispec-core-four-3mf
          if-no-files-found: error
          retention-days: 30
